<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Searchable Study Platform</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#17253a;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.top{background:#142033;color:white;padding:18px 24px}.wrap{max-width:960px;margin:auto}.brand{display:flex;justify-content:space-between;align-items:center}.pill{border:1px solid #52627a;border-radius:30px;padding:7px 12px;color:#dce7ff;font-size:13px}main{padding:55px 22px}h1{font-size:clamp(32px,5vw,48px);margin:8px 0}.muted{color:#64748b}.search{display:flex;gap:10px;margin:28px 0}.search input{flex:1;min-width:0;padding:14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}.search button{border:0;border-radius:10px;padding:0 22px;background:#315bd6;color:white;font-weight:700;cursor:pointer}.list{display:grid;gap:12px}.item{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:18px}.item h3{margin:0 0 6px}.foot{margin-top:38px;color:#64748b;font-size:13px}@media(max-width:520px){.search{flex-direction:column}.search button{padding:14px}}
</style></head><body>
<header class="top"><div class="wrap brand"><strong>▣ Searchable Study Platform</strong><span class="pill">Release __APP_VERSION__</span></div></header>
<main class="wrap"><p class="muted">STUDY SMARTER</p><h1>Find your study notes.</h1><p class="muted">Search a sample library of learning resources by topic, course or keyword.</p>
<div class="search"><input id="q" placeholder="Try AWS, DevOps, architecture…" aria-label="Search study notes"><button id="go">Search</button></div><p id="count" class="muted" aria-live="polite">Loading resources…</p><section id="results" class="list"></section><p class="foot">CI/CD demonstration · Version __APP_VERSION__ · Automatically tested and deployed</p></main>
<script>
const input=document.querySelector('#q'),results=document.querySelector('#results'),count=document.querySelector('#count');
async function search(){const r=await fetch('/api/documents?q='+encodeURIComponent(input.value));const data=await r.json();count.textContent=data.count+' resources found';results.replaceChildren();for(const d of data.documents){const card=document.createElement('article');card.className='item';const title=document.createElement('h3');title.textContent=d.title;const course=document.createElement('small');course.className='muted';course.textContent=d.course;const desc=document.createElement('p');desc.textContent=d.description;card.append(title,course,desc);results.append(card)}}
document.querySelector('#go').addEventListener('click',search);input.addEventListener('keydown',e=>{if(e.key==='Enter')search()});search();
</script></body></html>
